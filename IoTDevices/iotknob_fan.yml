substitutions:
  name: "KnobFan"

esphome:
  name: ducky-iotknobfan
  name_add_mac_suffix: true
  on_boot:
    - delay: 1 s  # required otherwise it boot loops
    - fusb302.start_power_negotiation:
        id: fusb302_id

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/rbaron/esphome
      ref: 666fb739dbad7e35bb944de86bb6cbebc1b6dcfd
    components: [fusb302]

wifi:
  <<: !include ../wifi_config.yaml

<<: !include ../common_config.yaml

# NOTE ESP32-S3 GPIOs
# Subtract 12 from right side pinning to account for removed bottom row
# [i2c=I2CEXT0, 
# i2c.scl=GPIO18, 11, 
# i2c.sda=GPIO8, 12, 
# i2c2=I2CEXT1, 
# i2c2.scl=GPIO7, 7, 
# i2c2.sda=GPIO6, 6, 
# pd_int=GPIO17, 10, 
# spk=XTAL_32K_N, 9, 
# drv=GPIO2, 38, 
# tach=GPIO1, 39, 
# pwm=XTAL_32K_P, 8, 
# npx_en=GPIO5, 5, 
# enc_a=MTDO, 33, 
# enc_b=MTCK, 32, 
# enc_sw=GPIO38, 31, 
# extra1=MTMS, 35, 
# npx=GPIO4, 4]

# User Calibrations
number:
  - platform: template
    name: "${name} OVP"   # OVP threshold
    id: ovp_limit
    mode: box
    restore_value: true
    step: 1
    min_value: 1
    max_value: 20
    initial_value: 14
    set_action:
      - then:
        - lambda: id(ovp_limit).publish_state(x);

switch:
  - platform: template
    name: "${name} Fault"  # latching
    id: fault
    optimistic: true
    on_turn_on: 
      then:
        - lambda: |-
            id(output_fan_pwr).turn_off();
            

interval:
  - interval: 100ms
    then:
      lambda: |-
        if (id(fault).state) {
          id(output_fan_pwr).turn_off();
        }

light:
  - platform: esp32_rmt_led_strip
    id: ring
    rgb_order: GRB
    chipset: sk6812
    pin: GPIO4
    num_leds: 6
    name: "${name} Neopixels"
    initial_state:
      state: ON
    restore_mode: RESTORE_AND_ON  # persistent brightness settings
    effects:
      - addressable_lambda:
          name: "Control"
          update_interval: 100ms
          lambda: |-
              it.all() = Color(0, 0, 0, 0);
              if (id(ina219_voltage).state > id(ovp_limit).state) {
                it[1] = Color(255, 0, 0, 255);
              } else if (id(ina219_voltage).state > 11.0) {
                it[1] = Color(0, 255, 0, 255);
              } else {
                it[1] = Color(255, 0, 255, 255);
              }

              uint8_t ringIndices[] = {2, 3, 4, 5, 0};
              for (int i = 0; i < 5; i++) {
                if (id(fan_ctl).state && (id(fan_ctl).speed >= ((i * 100 + 50) / 5))) {
                  it[ringIndices[i]] = Color(191, 191, 0, 255);
                } else {
                  it[ringIndices[i]] = Color(0, 0, 0, 0);
                }
              }
      - addressable_rainbow:
          name: Rainbow
    on_turn_on:
      - light.turn_on:
          id: ring
          effect: "Control"
  - platform: status_led
    name: "${name} Dbg"
    id: debug_led
    internal: true
    pin:
      number: GPIO9
      inverted: true

output:
  - platform: gpio
    id: output_fan_pwr
    pin: GPIO3
    inverted: false
  - platform: ledc
    id: output_fan_ctl
    pin: GPIO0
    inverted: true
    frequency: 25 kHz

i2c:
  scl: GPIO10
  sda: GPIO11
  frequency: 400kHz
  scan: false

fan:
  - platform: binary
    id: fan_pwr
    output: output_fan_pwr
    name: "${name} Drv"
  - platform: speed
    id: fan_ctl
    output: output_fan_ctl
    name: "${name} Ctl"
    on_turn_on:
    - then:
      - fan.turn_on: fan_pwr
    on_turn_off:
    - then:
      - fan.turn_off: fan_pwr
      
binary_sensor:
  - platform: gpio
    name: "${name} Encoder Sw"
    pin: 
      number: GPIO21
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 10ms
    on_click:
    - then:
        - lambda: |-
            esphome::fan::Fan* ctl_channels[] = {id(fan_ctl)};
            bool anyOn = false;
            for (auto ctl: ctl_channels) {
              anyOn |= ctl->state;
            }
            if (!anyOn) {  // currently off, turn on
              for (auto ctl: ctl_channels) {
                ctl->turn_on().perform();
              }
            } else {  // any on, turn off all
              for (auto ctl: ctl_channels) {
                ctl->turn_off().perform();
              }
            }

sensor:
  - platform: rotary_encoder
    name: "${name} Encoder"
    resolution: 2  # so each detent generates one action
    pin_a:
      number: GPIO23
      inverted: true
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO22
      inverted: true
      mode:
        input: true
        pullup: true
    on_clockwise:
    - then:
        - lambda: |-
            esphome::fan::Fan* ctl_channels[] = {id(fan_ctl)};
            for (auto ctl: ctl_channels) {
              auto call = ctl->turn_on();
              if (ctl->state != false) {  // first turn when off only turns on the fan
                call.set_speed(ctl->speed + 1);
              }
              call.perform();
            }
    on_anticlockwise:
    - then:
        - lambda: |-
            esphome::fan::Fan* ctl_channels[] = {id(fan_ctl)};
            for (auto ctl: ctl_channels) {
              if (ctl->speed <= 1) {
                auto call = ctl->turn_off();
                call.perform();
              } else {
                auto call = ctl->turn_on();
                call.set_speed(ctl->speed - 1);
                call.perform();
              }
            }

  - platform: pulse_counter
    pin:
      number: GPIO2
      mode:
        input: true
        pullup: true
    name: "${name} Tach"
    update_interval: 5s

  - platform: ina219
    shunt_resistance: 0.01 ohm
    bus_voltage:
      name: "${name} INA219 Voltage"
      id: ina219_voltage
      on_raw_value:
        then:
          - lambda: |-
              if (x > id(ovp_limit).state) {
                id(fault).publish_state(true);
              }
    current:
      name: "${name} INA219 Current"
    power:
      name: "${name} INA219 Power"
    max_voltage: 24.0V
    max_current: 3.2A
    update_interval: 5s
  - platform: vl53l0x
    name: "${name} VL53L0x"
    update_interval: 1s
    long_range: false
  - platform: bh1750
    name: "${name} BH1750"
    update_interval: 60s

  - platform: wifi_signal
    name: "${name} WiFi Signal"
    update_interval: 60s

fusb302:
  id: fusb302_id
  interrupt_pin: GPIO8
  voltage: 12 V
  current: 2 A
  start_power_negotiation_on_boot: false
  on_pd_negotiation_success:
    - lambda: |-
        ESP_LOGW("fusb302_trigger", "PD negotiation success outcome: %d", success);
  on_pd_negotiation_failure:
    then:
      - lambda: |-
          ESP_LOGW("fusb302_trigger", "PD negotiation failure outcome: %d", success);
