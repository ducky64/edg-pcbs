# based on https://github.com/ch32-rs/ch32-hal/blob/main/examples/ch32v203/Cargo.toml

[package]
name = "keyboard"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "keyboard"
path = "src/main.rs"

[dependencies]

static_cell = "2"
portable-atomic = { version = "1", features = ["critical-section"] }

defmt = "1.1.1"
defmt-rtt = "1.3.0"

ch32-hal = { git = "https://github.com/ch32-rs/ch32-hal.git", features = [
    "ch32v203k8t6",
    "memory-x",
    "embassy",
    "rt",
    "time-driver-tim2",
], default-features = false }
qingke-rt = "0.7"
# qingke = "0.7"
qingke = { git = "https://github.com/ch32-rs/qingke.git" }

embassy-executor = { version = "0.10.0", features = [
    "platform-spin",
    # "platform-riscv32",  # this breaks USB
    "executor-thread",
] }

embassy-time = "0.5.1"
embassy-usb = { version = "0.5.1" }
embassy-usb-driver = "=0.2.0"
embassy-futures = { version = "0.1.2" }
embassy-sync = "0.8"

# panic-halt = "1.0"

# latest published is 0.1.1 which uses older embedded-hal
keyberon = { git = "https://github.com/TeXitoi/keyberon.git" }

smart-leds = "0.4.0"
ws2812-spi = { version = "0.5.1", features=["mosi_idle_high", "reset_single_transaction"] }

embedded-hal = "1.0.0"
embedded-graphics = "0.8.1"
ssd1306 = "0.8.4"
heapless = "0.8.0"

[profile.release]
strip = false   # symbols are not flashed to the microcontroller, so don't strip them.
lto = true
opt-level = "z" # Optimize for size.

[profile.dev]  # these options needed to get it to fit in flash
strip = false
lto = true
opt-level = "z"
